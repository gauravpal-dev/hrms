<!DOCTYPE html>
<html lang="en" th:replace="~{user/userbase :: layout(~{::main})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Feedback / Complaint</title>
</head>
<body>
<main>
    <!-- Bootstrap 5 CSS & FontAwesome Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Minimal Essential CSS -->
    <style>
        .hero-banner { background: linear-gradient(135deg, #614ef6, #9b51e0); }
        .bg-purple { background-color: #614ef6 !important; }
        .btn-purple { 
            background: linear-gradient(135deg, #614ef6, #9b51e0); 
            color: white; 
            border: none;
        }
        .btn-purple:hover {
            background: linear-gradient(135deg, #503ee4, #8a3fd8);
            color: white;
        }
        .hero-banner i {
            color: white;
        }
    </style>

    <div class="container my-4" style="max-width: 650px;">

        <!-- Top Hero Header Banner -->
        <div class="hero-banner text-white p-4 rounded-4 d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3 shadow-sm">
            <div class="d-flex align-items-center gap-3">
                <div class="bg-white bg-opacity-10 rounded-3 d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                    <i class="fa-solid fa-comment-dots fs-4"></i>
                </div>
                <div>
                    <h3 class="mb-0 fw-bold fs-4">Submit Response</h3>
                    <small class="opacity-75">Share your feedback or register a complaint</small>
                </div>
            </div>
            <a th:href="@{/user/userdashboard}" class="btn btn-light bg-opacity-25 text-primary fw-bold border-0 rounded-pill px-3 py-1 btn-sm">
                <i class="fa-solid fa-arrow-left me-1 text-primary"></i> Dashboard
            </a>
        </div>

        <!-- Alert Notification -->
        <div th:if="${msg}" class="alert alert-success alert-dismissible fade show rounded-3 shadow-sm mb-4" role="alert">
            <i class="fa-solid fa-circle-check me-2"></i>
            <span th:text="${msg}">Response submitted successfully!</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Main Form Card Container -->
        <div class="card border-0 rounded-4 p-4 p-md-5 shadow-sm">
            <div class="fw-bold fs-5 text-dark mb-4 d-flex align-items-center gap-2 border-bottom pb-3">
                <i class="fa-solid fa-paper-plane text-primary"></i> Feedback / Complaint Form
            </div>

            <form method="post" th:object="${rdto}">
                <div class="row g-3">

                    <!-- Select Response Type -->
                    <div class="col-12">
                        <label class="form-label fw-bold small text-secondary">Select Response Type</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-list-check text-muted"></i></span>
                            <select class="form-select bg-light border-start-0" th:field="${rdto.responsetype}">
                                <option value="feedback">Feedback</option>
                                <option value="complaint">Complaint</option>
                            </select>
                        </div>
                    </div>

                    <!-- Enter Subject -->
                    <div class="col-12">
                        <label class="form-label fw-bold small text-secondary">Enter Subject</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-heading text-muted"></i></span>
                            <input type="text" th:field="${rdto.subject}" class="form-control bg-light border-start-0" required placeholder="Write a brief subject..." />
                        </div>
                    </div>

                    <!-- Enter Message -->
                    <div class="col-12">
                        <label class="form-label fw-bold small text-secondary">Enter Message</label>
                        <textarea th:field="${rdto.responsetext}" class="form-control bg-light" rows="5" required placeholder="Describe your feedback or complaint in detail..."></textarea>
                    </div>

                    <!-- Submit Button -->
                    <div class="col-12 mt-4 pt-2">
                        <button type="submit" class="btn btn-purple rounded-pill w-100 py-2.5 fw-bold shadow-sm">
                            <i class="fa-solid fa-paper-plane me-2"></i> Submit Response
                        </button>
                    </div>

                </div>
            </form>
        </div>

    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
</main>
</body>
</html>
